services:
  db:
    image: postgres:17
    container_name: elektro-db
    environment:
      POSTGRES_USER: elektro
      POSTGRES_PASSWORD: elektro
      POSTGRES_DB: elektro
    ports:
      - "5432:5432"
    volumes:
      - elektro_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elektro -d elektro"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  elektro_pg:
